# Pruebas locales; no se entrega. El central oficial y dos servidores del grupo en la misma
# máquina (recomendación de la sección 10 del enunciado), y el corredor de pruebas.
#
#   docker compose -f docker-compose.local.yml up --build                    # central en :9000, gNa en :8001, gNb en :8002
#   docker compose -f docker-compose.local.yml stop central                  # simular una caída del central
#   docker compose -f docker-compose.local.yml run --rm --build pruebas      # pytest
#
# El central es el mismo que corre en https://dsp.cshire.io, construido desde su
# repositorio público (D28). Su panel, en http://localhost:9000/, muestra los servidores
# registrados y la sala #general.
name: chat-local

x-servidor: &servidor
  build:
    context: ./servidor
    target: servidor
  stop_grace_period: 5s
  depends_on:
    - central

services:
  central:
    build:
      context: https://github.com/javierchacon262/central-server-dsp.git#main:servidor
      target: servidor
    environment:
      # En local los servidores tienen direcciones privadas; sin esto el central no
      # acepta registros en push.
      PERMITIR_URL_PRIVADAS: "true"
    ports:
      - "9000:9000"
    volumes:
      - datos-central:/datos

  servidor-a:
    <<: *servidor
    environment:
      GRUPO: ${GRUPO:-gN}a
      URL_PUBLICA: http://servidor-a:8000
      URL_CENTRAL: http://central:9000
      MODO_RECEPCION: ${MODO_RECEPCION:-pull}
    ports:
      - "8001:8000"
    volumes:
      - datos-a:/datos

  servidor-b:
    <<: *servidor
    environment:
      GRUPO: ${GRUPO:-gN}b
      URL_PUBLICA: http://servidor-b:8000
      URL_CENTRAL: http://central:9000
      MODO_RECEPCION: ${MODO_RECEPCION:-pull}
    ports:
      - "8002:8000"
    volumes:
      - datos-b:/datos

  pruebas:
    build:
      context: ./servidor
      target: pruebas
    profiles: [pruebas]

volumes:
  datos-central:
  datos-a:
  datos-b:
