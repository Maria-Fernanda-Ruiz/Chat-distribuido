# Pruebas locales; no se entrega. Dos servidores del grupo en la misma máquina
# (recomendación de la sección 10 del enunciado) y el corredor de pruebas.
#
#   docker compose -f docker-compose.local.yml up --build                    # gNa en :8001, gNb en :8002
#   docker compose -f docker-compose.local.yml run --rm --build pruebas      # pytest
#
# URL_CENTRAL apunta a "central", que agrega el central simulado (#7). Mientras no
# exista, los servidores arrancan igual: nadie llama al central en la etapa 1.
name: chat-local

x-servidor: &servidor
  build:
    context: ./servidor
    target: servidor
  stop_grace_period: 5s

services:
  servidor-a:
    <<: *servidor
    environment:
      GRUPO: ${GRUPO:-gN}a
      URL_PUBLICA: http://servidor-a:8000
      URL_CENTRAL: http://central:9000
    ports:
      - "8001:8000"
    volumes:
      - datos-a:/datos

  servidor-b:
    <<: *servidor
    environment:
      GRUPO: ${GRUPO:-gN}b
      URL_PUBLICA: http://servidor-b:8000
      URL_CENTRAL: http://central:9000
    ports:
      - "8002:8000"
    volumes:
      - datos-b:/datos

  pruebas:
    build:
      context: ./servidor
      target: pruebas
    profiles: [pruebas]

volumes:
  datos-a:
  datos-b:
